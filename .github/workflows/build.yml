name: Build

# A build check only: it fails on type errors, broken MDX, and anything else
# that would break the site. Deploys are a manual `wrangler pages deploy`
# (the Cloudflare Pages project has no Git connection): see README.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
